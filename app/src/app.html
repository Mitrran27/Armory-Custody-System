<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<script>
			// Applied before first paint to avoid a flash of the wrong theme.
			(function () {
				try {
					var stored = localStorage.getItem('aawcs.theme');
					var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
					document.documentElement.classList.toggle('light', theme === 'light');
					document.documentElement.classList.toggle('dark', theme === 'dark');
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<title>AAWCS &mdash; Armory Access &amp; Weapons Custody System</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base text-ink antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
