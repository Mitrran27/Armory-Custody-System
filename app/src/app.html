<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<script>
			// Applied before first paint to avoid a flash of the wrong theme.
			(function () {
				try {
					var stored = localStorage.getItem('aawcs.theme');
					var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
					document.documentElement.classList.toggle('light', theme === 'light');
					document.documentElement.classList.toggle('dark', theme === 'dark');
				} catch (e) {}
			})();
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="AAWCS Portal" />
		<script>
			// No single default manifest here — there are now two separate
			// installable PWAs (armorer, guard), each with its own manifest
			// injected by that route's own +layout.svelte via <svelte:head>,
			// so "Add to Home Screen" installs the right one depending on
			// which portal you're actually on.
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch(() => {
						/* non-fatal — app still works without the service worker */
					});
				});
			}
		</script>
		<title>AAWCS &mdash; Armory Access &amp; Weapons Custody System</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base text-ink antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
