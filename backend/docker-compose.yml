services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aawcs
      POSTGRES_PASSWORD: aawcs_dev_password
      POSTGRES_DB: aawcs
    ports:
      - '5432:5432'
    volumes:
      - aawcs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aawcs -d aawcs']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aawcs_pgdata:
